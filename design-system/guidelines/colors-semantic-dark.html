<!-- @dsCard group="Colors" viewport="700x160" name="Surfaces · Dark" subtitle="Same tokens under data-theme=dark." -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Surfaces · Dark</title>
<link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="card.css">
<style>body{background:var(--bg-app)}</style>
</head><body data-theme="dark">
<div class="grid" style="grid-template-columns:repeat(6,1fr)"><div class="tile" style="background:var(--bg-app);color:var(--text-primary)"><b>App</b><code>--bg-app</code></div><div class="tile" style="background:var(--surface-card);color:var(--text-primary)"><b>Card</b><code>--surface-card</code></div><div class="tile" style="background:var(--fill-1);color:var(--text-primary)"><b>Fill 1</b><code>--fill-1</code></div><div class="tile" style="background:var(--fill-2);color:var(--text-primary)"><b>Fill 2</b><code>--fill-2</code></div><div class="tile" style="background:var(--ink);color:var(--on-ink)"><b>Ink</b><code>--ink</code></div><div class="tile" style="background:var(--accent);color:var(--on-accent)"><b>Accent</b><code>--accent</code></div></div><div class="row" style="margin-top:14px;gap:24px;align-items:baseline"><span style="font:var(--type-headline);color:var(--text-primary)">Primary text</span><span style="font:var(--type-headline);color:var(--text-secondary)">Secondary text</span><span style="font:var(--type-headline);color:var(--text-tertiary)">Tertiary text</span><span style="font:var(--type-headline);color:var(--accent-text)">Accent text</span></div>
</body></html>
