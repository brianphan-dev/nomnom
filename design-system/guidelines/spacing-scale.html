<!-- @dsCard group="Spacing" viewport="700x130" name="Spacing scale" subtitle="4pt grid. Screen margin is 20; card padding 16 or 20." -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Spacing scale</title>
<link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="card.css">
</head><body>
<div class="row"><div><div style="width:2px;height:2px;background:var(--accent);border-radius:0.6666666666666666px"></div><div class="cap">half<br>2</div></div><div><div style="width:4px;height:4px;background:var(--accent);border-radius:1.3333333333333333px"></div><div class="cap">1<br>4</div></div><div><div style="width:8px;height:8px;background:var(--accent);border-radius:2.6666666666666665px"></div><div class="cap">2<br>8</div></div><div><div style="width:12px;height:12px;background:var(--accent);border-radius:4px"></div><div class="cap">3<br>12</div></div><div><div style="width:16px;height:16px;background:var(--accent);border-radius:5.333333333333333px"></div><div class="cap">4<br>16</div></div><div><div style="width:20px;height:20px;background:var(--accent);border-radius:6px"></div><div class="cap">5<br>20</div></div><div><div style="width:24px;height:24px;background:var(--accent);border-radius:6px"></div><div class="cap">6<br>24</div></div><div><div style="width:32px;height:32px;background:var(--accent);border-radius:6px"></div><div class="cap">8<br>32</div></div><div><div style="width:40px;height:40px;background:var(--accent);border-radius:6px"></div><div class="cap">10<br>40</div></div><div><div style="width:48px;height:48px;background:var(--accent);border-radius:6px"></div><div class="cap">12<br>48</div></div><div><div style="width:64px;height:64px;background:var(--accent);border-radius:6px"></div><div class="cap">16<br>64</div></div></div>
</body></html>
