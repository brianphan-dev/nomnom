<html lang="en"><head><meta charset="utf-8"><title>Control heights</title>
<link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="card.css">
</head><body>
<div class="row" style="align-items:center"><div style="height:32px;padding:0 20px;border-radius:999px;background:var(--fill-1);display:flex;align-items:center;gap:8px;font:600 15px/1 var(--font-sans)">--control-sm <span class="nn-num" style="font-weight:400;color:var(--text-secondary)">32</span></div><div style="height:44px;padding:0 20px;border-radius:999px;background:var(--fill-1);display:flex;align-items:center;gap:8px;font:600 15px/1 var(--font-sans)">--control-md <span class="nn-num" style="font-weight:400;color:var(--text-secondary)">44</span></div><div style="height:56px;padding:0 20px;border-radius:999px;background:var(--fill-1);display:flex;align-items:center;gap:8px;font:600 15px/1 var(--font-sans)">--control-lg <span class="nn-num" style="font-weight:400;color:var(--text-secondary)">56</span></div><div style="width:72px;height:72px;border-radius:50%;background:var(--accent);display:grid;place-items:center;font:var(--type-num-sm);color:var(--on-accent)">72</div><span class="tok" style="color:var(--text-secondary)">shutter</span></div>
