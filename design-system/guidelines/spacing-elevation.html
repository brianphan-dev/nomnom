<!-- @dsCard group="Spacing" viewport="700x150" name="Elevation" subtitle="Cards are flat. Only floating chrome and sheets cast shadows." -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Elevation</title>
<link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="card.css">
<style>body{background:var(--bg-app)}</style>
</head><body>
<div class="grid" style="grid-template-columns:repeat(4,1fr);gap:24px;padding:8px 8px 0"><div><div style="height:64px;border-radius:20px;background:var(--surface-card);box-shadow:none"></div><div class="cap">none<br>Card</div></div><div><div style="height:64px;border-radius:20px;background:var(--surface-card);box-shadow:var(--shadow-knob)"></div><div class="cap">--shadow-knob<br>Switch, segment</div></div><div><div style="height:64px;border-radius:20px;background:var(--surface-card);box-shadow:var(--shadow-float)"></div><div class="cap">--shadow-float<br>Capture dock, dialog</div></div><div><div style="height:64px;border-radius:20px;background:var(--surface-card);box-shadow:var(--shadow-sheet)"></div><div class="cap">--shadow-sheet<br>Bottom sheet</div></div></div>
</body></html>
