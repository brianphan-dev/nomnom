<!-- @dsCard group="Colors" viewport="700x130" name="Status" subtitle="Honey is the only warning hue. Beet appears only on destructive actions." -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Status</title>
<link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="card.css">
</head><body>
<div class="grid" style="grid-template-columns:repeat(4,1fr)"><div class="tile" style="background:var(--check-soft);color:var(--check-text);box-shadow:none"><b>Check</b><code>--check</code><span style="font:var(--type-caption);color:var(--text-primary);opacity:.8">AI confidence under 76%</span></div><div class="tile" style="background:var(--positive-soft);color:var(--positive-text);box-shadow:none"><b>Positive</b><code>--positive</code><span style="font:var(--type-caption);color:var(--text-primary);opacity:.8">Synced, imported</span></div><div class="tile" style="background:var(--info-soft);color:var(--info-text);box-shadow:none"><b>Info</b><code>--info</code><span style="font:var(--type-caption);color:var(--text-primary);opacity:.8">Sources, explanations</span></div><div class="tile" style="background:var(--danger-soft);color:var(--danger-text);box-shadow:none"><b>Danger</b><code>--danger</code><span style="font:var(--type-caption);color:var(--text-primary);opacity:.8">Delete only</span></div></div>
</body></html>
